name: Test

on:
  push:
    branches: [main]
  pull_request:

# The unit tests and the app check run side by side, so a run takes about as
# long as the slower of the two instead of both added together.
jobs:
  unit:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Warnings fail the build, so new ones get fixed rather than pile up.
      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors

  app:
    name: App bundle and launch check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The audio smoke test (`make test`) needs a sound output device, which
      # CI runners don't have, so CI stops at building the signed app bundle.
      - name: Build app bundle
        run: make bundle
        env:
          # Fail if the Liquid Glass icon (Resources/AppIcon.icon) can't be
          # compiled, rather than quietly shipping only AppIcon.icns.
          REQUIRE_GLASS_ICON: 1

      # Launch the built app, interface and all, and fail on runaway CPU or
      # memory. The unit tests don't run the app's SwiftUI scene.
      - name: Launch check
        run: scripts/launch_check.sh dist/ThockBox.app
        env:
          MAX_CPU: 10
          MEASURE_SECONDS: 30

  # Commits and the pull request description credit people only: no AI tool
  # as an author or co-author (merges use the PR title and description).
  credits:
    name: No AI credits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check commits and description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: >
          scripts/check_no_ai_credit.sh
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  # The status check branch protection requires. It runs even when a job
  # above fails (GitHub counts a skipped required check as passed), and
  # passes only if all of them did.
  test:
    needs: [unit, app, credits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both jobs passed
        run: |
          echo "unit: ${{ needs.unit.result }}, app: ${{ needs.app.result }}, credits: ${{ needs.credits.result }}"
          test "${{ needs.unit.result }}" = success
          test "${{ needs.app.result }}" = success
          # Skipped on pushes to main, where there's no pull request.
          test "${{ needs.credits.result }}" = success -o "${{ needs.credits.result }}" = skipped
