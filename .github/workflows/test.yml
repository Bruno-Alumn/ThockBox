name: Test

on:
  push:
    branches: [main]
  pull_request:

# The unit tests and the app check run side by side, so a run takes about as
# long as the slower of the two instead of both added together.
jobs:
  unit:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Warnings fail the build, so new ones get fixed rather than pile up.
      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors

  app:
    name: App bundle and launch check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The audio smoke test (`make test`) needs a sound output device, which
      # CI runners don't have, so CI stops at building the signed app bundle.
      - name: Build app bundle
        run: make bundle

      # Launch the built app, interface and all, and fail on runaway CPU or
      # memory. The unit tests don't run the app's SwiftUI scene.
      - name: Launch check
        run: scripts/launch_check.sh dist/ThockBox.app
        env:
          MAX_CPU: 10
          MEASURE_SECONDS: 30

  # The status check branch protection requires. It runs even when a job
  # above fails (GitHub counts a skipped required check as passed), and
  # passes only if both did.
  test:
    needs: [unit, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both jobs passed
        run: |
          echo "unit: ${{ needs.unit.result }}, app: ${{ needs.app.result }}"
          test "${{ needs.unit.result }}" = success
          test "${{ needs.app.result }}" = success
